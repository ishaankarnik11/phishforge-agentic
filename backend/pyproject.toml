[project]
name = "acme-emailer-backend"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0",
  "aiomysql>=0.2",
  "pymysql>=1.1",
  "alembic>=1.13",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.2",
  "passlib[bcrypt]>=1.7",
  # passlib 1.7 + bcrypt 5.x crash on hashpw because passlib reads
  # bcrypt.__about__.__version__ which 5.x removed. Pin until passlib
  # ships a fix or we move off passlib.
  "bcrypt>=4.0,<4.1",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.9",
  "anthropic>=0.30",
  "instructor>=1.3",
  "langsmith>=0.1",
  "Pillow>=10.0",
  "openai>=1.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "coverage>=7",
  "pytest-cov>=5",
  "types-passlib>=1.7",
  "types-python-jose>=3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests that hit a real external API (e.g. Anthropic). Run with `pytest -m integration`.",
]
