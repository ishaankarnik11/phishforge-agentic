# Static SPA serving for the Acme Emailer frontend.
#
# This nginx is a *static file server only* — it does NO /api proxying.
# All API and asset routing is owned by Nginx Proxy Manager (NPM) at the
# edge: NPM forwards /api/*, /uploads/*, /static/* to the backend, and
# everything else to this container.
#
# Single server block; we are listening on the container's port 80
# behind Docker's network bridge. NPM provides TLS, HSTS, etc.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Gzip text-y assets. Vite-emitted hashes are random, so brotli would
    # be a nice-to-have but isn't bundled with nginx:alpine. Gzip on its
    # own is enough for the bundle sizes we ship.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf;

    # Modest log size; container stdout is captured by docker's json-file
    # driver anyway.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Hashed assets emitted by Vite live under /assets/ — they are
        # content-addressed, so we cache aggressively and never revisit.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # The HTML shell must NOT be cached — it's the only thing that
        # references the new hashed bundles after a deploy.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        # Tiny health endpoint so a container-level HEALTHCHECK doesn't
        # have to parse /index.html. Returns "ok\n" with 200.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # SPA history fallback. Anything that isn't a file/directory on
        # disk falls back to index.html so React Router can take over.
        # /api, /uploads, /static are NOT routed here — they never reach
        # this container; NPM points them at the backend.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
